<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end verl reinforcement learning step on four AMD Instinct MI455X GPUs</title>
  <desc id="desc">Prompts enter an SGLang rollout engine, responses are scored to produce GRPO advantages, an FSDP actor updates the policy, and fresh weights are synchronized back before the next rollout.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#17213A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-slate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#536174"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#A46608"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 43px; font-weight: 700; fill: #17213A; }
      .subtitle { font-size: 23px; font-weight: 400; fill: #657188; }
      .boundary-label { font-size: 22px; font-weight: 700; fill: #536174; letter-spacing: 0.4px; }
      .stage-number { font-size: 18px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1.2px; }
      .stage-title { font-size: 27px; font-weight: 700; fill: #FFFFFF; }
      .stage-copy { font-size: 20px; font-weight: 400; fill: #FFFFFF; }
      .chip { font-size: 16px; font-weight: 600; fill: #FFFFFF; }
      .prompt-title { font-size: 25px; font-weight: 700; fill: #0B6E82; }
      .prompt-copy { font-size: 17px; font-weight: 400; fill: #536174; }
      .return-label { font-size: 21px; font-weight: 600; fill: #8B5708; }
    </style>
  </defs>

  <rect width="1600" height="700" fill="#F7F9FC"/>

  <text x="800" y="66" text-anchor="middle" class="sans title">One end-to-end verl training step</text>
  <text x="800" y="105" text-anchor="middle" class="sans subtitle">Generation, actor training, and fresh-weight rollout on four AMD Instinct MI455X GPUs</text>

  <rect x="225" y="142" width="1315" height="492" rx="30" fill="#FFFFFF" stroke="#CBD4DF" stroke-width="3"/>
  <rect x="258" y="125" width="348" height="36" rx="18" fill="#F7F9FC"/>
  <text x="432" y="150" text-anchor="middle" class="sans boundary-label">4 x AMD INSTINCT MI455X</text>

  <g filter="url(#shadow)">
    <rect x="25" y="270" width="165" height="140" rx="22" fill="#FFFFFF" stroke="#0B6E82" stroke-width="4"/>
  </g>
  <text x="108" y="325" text-anchor="middle" class="sans prompt-title">Prompts</text>
  <text x="108" y="360" text-anchor="middle" class="sans prompt-copy">8 per batch</text>
  <text x="108" y="386" text-anchor="middle" class="sans prompt-copy">8 samples each</text>

  <g filter="url(#shadow)">
    <rect x="270" y="225" width="265" height="230" rx="24" fill="#0B6E82"/>
  </g>
  <text x="402" y="269" text-anchor="middle" class="sans stage-number">1 - ROLLOUT</text>
  <text x="402" y="313" text-anchor="middle" class="sans stage-title">SGLang generation</text>
  <text x="402" y="354" text-anchor="middle" class="sans stage-copy">
    <tspan x="402" dy="0">Generate responses</tspan>
    <tspan x="402" dy="29">and record logprobs</tspan>
  </text>
  <rect x="318" y="407" width="168" height="30" rx="15" fill="#31899A"/>
  <text x="402" y="428" text-anchor="middle" class="sans chip">4-way tensor parallel</text>

  <g filter="url(#shadow)">
    <rect x="585" y="225" width="265" height="230" rx="24" fill="#1A7048"/>
  </g>
  <text x="717" y="269" text-anchor="middle" class="sans stage-number">2 - REWARD</text>
  <text x="717" y="313" text-anchor="middle" class="sans stage-title">GRPO advantages</text>
  <text x="717" y="354" text-anchor="middle" class="sans stage-copy">
    <tspan x="717" dy="0">Score responses</tspan>
    <tspan x="717" dy="29">within each group</tspan>
  </text>
  <rect x="651" y="407" width="132" height="30" rx="15" fill="#3F8B68"/>
  <text x="717" y="428" text-anchor="middle" class="sans chip">8 samples / prompt</text>

  <g filter="url(#shadow)">
    <rect x="900" y="225" width="265" height="230" rx="24" fill="#526174"/>
  </g>
  <text x="1032" y="269" text-anchor="middle" class="sans stage-number">3 - ACTOR UPDATE</text>
  <text x="1032" y="313" text-anchor="middle" class="sans stage-title">FSDP training</text>
  <text x="1032" y="354" text-anchor="middle" class="sans stage-copy">
    <tspan x="1032" dy="0">Recompute logprobs</tspan>
    <tspan x="1032" dy="29">and update the policy</tspan>
  </text>
  <rect x="974" y="407" width="116" height="30" rx="15" fill="#758193"/>
  <text x="1032" y="428" text-anchor="middle" class="sans chip">bf16 actor</text>

  <g filter="url(#shadow)">
    <rect x="1215" y="225" width="265" height="230" rx="24" fill="#A46608"/>
  </g>
  <text x="1347" y="269" text-anchor="middle" class="sans stage-number">4 - WEIGHT SYNC</text>
  <text x="1347" y="313" text-anchor="middle" class="sans stage-title">Refresh rollout</text>
  <text x="1347" y="354" text-anchor="middle" class="sans stage-copy">
    <tspan x="1347" dy="0">Install updated actor</tspan>
    <tspan x="1347" dy="29">weights in SGLang</tspan>
  </text>
  <rect x="1283" y="407" width="128" height="30" rx="15" fill="#BC852E"/>
  <text x="1347" y="428" text-anchor="middle" class="sans chip">every step</text>

  <path d="M190 340 H270" fill="none" stroke="#536174" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
  <path d="M535 340 H585" fill="none" stroke="#536174" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
  <path d="M850 340 H900" fill="none" stroke="#536174" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
  <path d="M1165 340 H1215" fill="none" stroke="#536174" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-slate)"/>

  <path d="M1347 455 V548 H402 V455" fill="none" stroke="#A46608" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <rect x="555" y="524" width="640" height="48" rx="24" fill="#FFFFFF"/>
  <text x="875" y="555" text-anchor="middle" class="sans return-label">Updated weights become the next rollout policy</text>
</svg>
